  --card-grad-1: #1c7a52; --card-grad-2: #0c3a27;
  --art-stroke: #c7d6cd; --art-fill: #24302a; --art-screen: #0b100d; --art-screen-on: #2c5a43;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ── База ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-feature-settings: "cv11", "ss01", "tnum";
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
/* Иконки по умолчанию: без явного размера SVG растягивается на всю ширину */
svg[aria-hidden="true"] { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row > svg { width: 22px; height: 22px; flex: none; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 18px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }

/* ── Верхняя панель ─────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar { padding-top: env(safe-area-inset-top); }
.topbar-in {
  max-width: 1280px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.proto { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 2px 7px; border-radius: 999px; }
.tabs { display: flex; gap: 4px; flex: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
  border: 0; background: transparent; color: var(--muted);
  padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 14px;
}
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab[aria-selected="true"] { background: var(--brand-soft); color: var(--brand); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--err); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--surface-2); }

@media (max-width: 860px) {
  .topbar-in { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px 0; }
  .brand { flex: 1; }
  .tabs { order: 3; flex-basis: 100%; justify-content: flex-start; margin: 0 -16px; padding: 0 12px 8px; }
  .tab { padding: 7px 10px; font-size: 13px; }
}
@media (max-width: 600px) {
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin: 0 -10px; padding: 0 4px 6px; }
  .tab { position: relative; flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 11px; border-radius: 10px; }
  .tab svg { width: 20px; height: 20px; }
  .tab .dot { position: absolute; top: 5px; right: calc(50% - 16px); }
}

/* ── Контент ────────────────────────────────────────────────────────────── */
.view { max-width: 1280px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
html, body { -webkit-tap-highlight-color: transparent; }
.phone-col { max-width: 440px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.screen-head p { margin-top: 4px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--brand); font-weight: 600; padding: 4px 0; margin-bottom: 8px; }
.back svg { width: 18px; height: 18px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card.flat { box-shadow: none; }
.card.tight { padding: 12px; }
.card-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 8px; }

.note-demo { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.note-sim { color: var(--tag-donor); background: var(--tag-donor-bg); }
.note-real { color: var(--tag-whole); background: var(--tag-whole-bg); }
.tbd { color: var(--warn); font-style: normal; font-weight: 600; }

/* Кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--surface-2); color: var(--text); text-decoration: none; transition: transform .06s ease, background .15s ease; }
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-2); }
.btn.ghost { background: transparent; border-color: var(--border); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--err-soft); color: var(--err); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

/* Бирки */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag.whole { color: var(--tag-whole); background: var(--tag-whole-bg); }
.tag.donor { color: var(--tag-donor); background: var(--tag-donor-bg); }
.tag.danger { color: var(--tag-danger); background: var(--tag-danger-bg); }
.tag.raw { color: var(--tag-raw); background: var(--tag-raw-bg); }
.tag.none { color: var(--muted); background: var(--surface-2); }
.grade { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-weight: 800; font-size: 13px; color: var(--grade-ink); }
.grade.A { background: var(--grade-a); } .grade.B { background: var(--grade-b); } .grade.C { background: var(--grade-c); }

/* Поля */
.field { display: grid; gap: 6px; }
.field label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, select.input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.input.big { font-size: 28px; font-weight: 700; padding: 10px 14px; letter-spacing: -.01em; }
.hint { font-size: 13px; color: var(--muted); }
.error { font-size: 13px; color: var(--err); font-weight: 600; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.check input { width: 22px; height: 22px; accent-color: var(--brand); margin: 1px 0 0; flex: none; }

/* Плитки выбора */
.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.choice:hover { border-color: var(--brand); }
.choice[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; background: var(--brand-soft); }
.choice .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--brand); flex: none; }
.choice .ico svg { width: 22px; height: 22px; }

.examples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ex { position: relative; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 8px 6px 10px; display: grid; justify-items: center; gap: 2px; text-align: center; }
.ex:hover { border-color: var(--brand); }
.ex .art { width: 64px; height: 64px; }
.ex b { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.ex span { font-size: 11.5px; color: var(--muted); }
.ex .note-demo { position: absolute; top: 6px; right: 6px; font-size: 9.5px; padding: 1px 6px; }

/* Подтемы техники */
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; scroll-padding: 16px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.cat:hover { border-color: var(--brand); }
.cat[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.ex-bonus { font-size: 11.5px; font-weight: 700; color: var(--brand) !important; }

/* Каталог магазина */
.shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.shop-item { position: relative; display: grid; justify-items: center; gap: 2px; text-align: center; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 10px 8px 12px; }
.shop-item:hover { border-color: var(--brand); }
.shop-item .art { width: 76px; height: 76px; }
.shop-item b { font-size: 14px; }
.shop-item[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; background: var(--brand-soft); }
.shop-item .pick { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); display: grid; place-items: center; color: transparent; }
.shop-item .pick svg { width: 14px; height: 14px; }
.shop-item[aria-checked="true"] .pick { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
@media (min-width: 480px) { .shop-grid { grid-template-columns: repeat(3, 1fr); } }

/* Иллюстрации */
.art { display: block; }
.art .a-body { fill: var(--art-fill); stroke: var(--art-stroke); stroke-width: 2.5; stroke-linejoin: round; }
.art .a-screen-off { fill: var(--art-screen); }
.art .a-screen { fill: var(--art-screen-on); }
.art .a-ink { fill: var(--art-stroke); }
.art .a-ink-line { fill: none; stroke: var(--art-stroke); stroke-width: 3; stroke-linecap: round; }
.art .a-key { fill: var(--surface); stroke: var(--art-stroke); stroke-width: 1.5; }
.art .a-crack { fill: none; stroke: #f2f5f3; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.art .a-ok { fill: none; stroke: var(--tag-whole); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .a-swell { fill: none; stroke: var(--tag-danger); stroke-width: 2.5; stroke-dasharray: 4 4; }
.art .a-thin { fill: none; stroke: var(--art-stroke); stroke-width: 2; stroke-linecap: round; opacity: .65; }
.art .a-warn { fill: #f0b247; stroke: var(--art-stroke); stroke-width: 1.5; stroke-linejoin: round; }

.mini-ico { width: 36px; height: 36px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.mini-ico svg { width: 20px; height: 20px; }

/* Списки */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.li:first-child { border-top: 0; }
.li .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--brand); }
.li .ico svg { width: 20px; height: 20px; }
.li .ico.neg { color: var(--muted); }
.li .amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.li .amt.pos { color: var(--tag-whole); }

/* Таблицы */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; border-bottom: 0; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kpi .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

.progress { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); border-radius: inherit; min-width: 3px; transition: width .6s ease; }

/* Кошелёк — карта как в банке */
.bank-card {
  position: relative; overflow: hidden; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.18), transparent 50%), linear-gradient(135deg, var(--card-grad-1), var(--card-grad-2));
  border-radius: 22px; padding: 20px; box-shadow: var(--shadow-lg);
}
.bank-card .bal { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.bank-card .unit { font-size: 18px; font-weight: 600; opacity: .85; }
.bank-card .sub { opacity: .85; font-size: 13.5px; }
.bank-card .ring { position: absolute; right: -40px; bottom: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid rgba(255,255,255,.08); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick button { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; }
.quick button .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.quick button .ico svg { width: 22px; height: 22px; }
.quick button:hover { border-color: var(--brand); }
.quick button[aria-disabled="true"] { opacity: .55; }

.notice { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent); }
.notice .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.notice .ico svg { width: 20px; height: 20px; }
.notice.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.notice.warn .ico { background: var(--warn); }

/* Квитанция и паспорта */
.receipt { text-align: center; display: grid; gap: 12px; justify-items: center; }
.qr { width: 180px; height: 180px; border-radius: 12px; background: #fff; padding: 2px; }
.qr-sm .qr { width: 92px; height: 92px; }
.passport { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; border: 1px dashed var(--border); border-radius: 14px; padding: 12px; background: var(--surface); }
.passport .lines { font-size: 13px; display: grid; gap: 2px; }
.passport .lines b { font-size: 14px; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-3); }
.steps i.on { background: var(--brand); }

/* Дашборды (Хаб, Акимат) */
.dash { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
@media (max-width: 1000px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } }

.queue { display: grid; gap: 8px; }
.qi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.qi:hover { border-color: var(--brand); }
.qi[aria-current="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.qi .art { width: 40px; height: 40px; flex: none; }
.qi .new { font-size: 11px; font-weight: 700; color: var(--brand); }

.cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.cell { border-radius: 10px; border: 1px solid var(--border); padding: 6px 4px; text-align: center; font-size: 11px; background: var(--surface); display: grid; gap: 2px; justify-items: center; }
.cell .grade { width: 22px; height: 22px; font-size: 12px; }
.cell.idle .grade { background: var(--surface-3); color: var(--faint); }
.cell.running { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { background: var(--brand-soft); } }
@media (max-width: 560px) { .cells { grid-template-columns: repeat(4, 1fr); } }

.chart-box { position: relative; height: 260px; }
.chart-box.sm { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.bars { display: grid; gap: 12px; }
.bar-row { display: grid; gap: 5px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar-track { position: relative; height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.bar-track > i { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: 6px; }
.bar-track > i.fact { background: var(--warn); }

.code { font: 500 12.5px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
.formula { font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }

.counter { font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.counter small { font-size: 20px; font-weight: 600; color: var(--muted); }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { color: var(--brand); transform: scale(1.04); } 100% { transform: none; } }

/* Модальное окно и тост */
.sheet-back { position: fixed; inset: 0; background: rgba(8, 14, 11, .45); z-index: 40; display: grid; place-items: end center; animation: fade .15s ease; }
@media (min-width: 700px) { .sheet-back { place-items: center; } }
.sheet { width: min(480px, 100%); max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px 22px; box-shadow: var(--shadow-lg); animation: up .2s ease; }
@media (min-width: 700px) { .sheet { border-radius: 22px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 14px; animation: up .2s ease; }

.menu { position: absolute; right: 16px; top: 56px; width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 8px; z-index: 30; }
.menu button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: flex-start; padding: 10px; border: 0; background: none; border-radius: 10px; }
.menu button:hover { background: var(--surface-2); }
.menu button > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--muted); }
@media (max-width: 600px) { .menu { left: 12px; right: 12px; width: auto; top: 52px; } }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
.switch { position: relative; width: 40px; height: 24px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch.on { background: var(--brand); }
.switch.on::after { transform: translateX(16px); }

.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); }
.crew { background: #13201a; color: #e5eee8; border-radius: 22px; padding: 16px; }
.crew .card { background: #1b2a22; border-color: #2a3a31; color: #e5eee8; box-shadow: none; }
.crew .muted { color: #9aaba1; }
</style>
